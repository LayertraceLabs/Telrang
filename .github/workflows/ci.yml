name: CI

on:
  push:
    # Branches only: a v* tag runs release.yml, which calls this workflow.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --no-incremental -warnaserror
      - run: dotnet test --no-build
      - run: dotnet format --verify-no-changes --no-restore

  # The Web tests again on PostgreSQL (DESIGN.md §28): one database per test app, created and dropped by the tests.
  web-tests-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: telrang-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TELRANG_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=telrang-ci;Database=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -warnaserror
      - run: dotnet test tests/Telrang.Web.Tests --no-build

  # Browser smoke tests (DESIGN.md §24.7): the published app in headless Firefox over WebDriver BiDi.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned so a browser release cannot break CI unannounced; bump it on purpose.
      FIREFOX_VERSION: '158.0.1'
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Firefox ${{ env.FIREFOX_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/firefox.tar" \
            "https://download.mozilla.org/?product=firefox-${FIREFOX_VERSION}-ssl&os=linux64&lang=en-US"
          tar -xf "$RUNNER_TEMP/firefox.tar" -C "$RUNNER_TEMP"
          echo "FIREFOX=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/firefox/firefox" --version
      - name: Browser smoke tests
        run: scripts/e2e.sh
      - name: Upload app log and failure screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: ${{ env.E2E_ARTIFACTS }}
          if-no-files-found: ignore
          retention-days: 14
